name: claude-review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Set this to the Claude Code version you tested (verify on your Claude Code version).
  CLAUDE_CODE_VERSION: "2.1.288"

jobs:
  review:
    # Skip drafts and fork PRs: forks get no secrets under pull_request.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code (pinned version)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Compute the PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}...HEAD" > pr.diff

      - name: Headless Claude review (structured JSON)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .ci/run_review.py --diff pr.diff --out review.json

      - name: Gate (plain code decides)
        run: python .ci/gate.py --review review.json --diff pr.diff --summary "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .ci/gate.py --review review.json --diff pr.diff > gate.md || true
          gh pr comment "$PR_NUMBER" --body-file gate.md

      - name: Upload the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review
          path: |
            review.json
            gate.md
